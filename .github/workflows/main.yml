name: Genesis AI Auto-Scraper

on:
  schedule:
    - cron: '0 2 * * *' # Runs at 02:00 UTC daily
  workflow_dispatch: # Allows manual trigger

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas yfinance supabase

      - name: Run Scraper & DB Injector
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python scraper.py

      - name: Run AI Predictor
        run: python predict.py

      - name: Commit and Push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Genesis Bot"
          git add market_data.csv prediction_output.csv
          git commit -m "Auto-update: Pipeline executed successfully" || echo "No changes to commit"
          git push
