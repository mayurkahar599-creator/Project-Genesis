name: Genesis Scraper & AI Engine

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  execute-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Access the Vault
        uses: actions/checkout@v3

      - name: Booting Python System
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Loading Weapons
        run: pip install -r requirements.txt

      - name: Phase 1 - Executing Data Extraction
        run: python scraper.py
        
      - name: Phase 2 - Executing AI Forecast
        run: python predict.py
        
      - name: Secure Payload to Vault
        run: |
          git config --global user.name 'Genesis Bot'
          git config --global user.email 'bot@genesis.com'
          git add market_data.csv prediction_output.csv
          git commit -m "Auto-update: Pipeline executed successfully on $(date)" || echo "No new data to commit"
          git push origin main
