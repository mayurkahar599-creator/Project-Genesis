<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Genesis | Algorithmic Market Intelligence</title>
    <!-- Chart.js for Graphs -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- PapaParse for reading CSV -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&family=Inter:wght@300;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #0a0a0a;
            --panel-bg: #121212;
            --text-main: #e0e0e0;
            --neon-gold: #FFD700;
            --cyber-green: #00FF41;
            --border-color: #333;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header {
            text-align: center;
            padding: 40px 20px;
            width: 100%;
            border-bottom: 1px solid var(--border-color);
            background-color: var(--panel-bg);
        }

        h1 {
            margin: 0;
            font-size: 2.5rem;
            letter-spacing: 2px;
            color: #fff;
        }

        .tagline {
            font-family: 'Roboto Mono', monospace;
            color: #888;
            margin-top: 10px;
            font-size: 0.9rem;
        }

        .dashboard {
            width: 90%;
            max-width: 1000px;
            margin: 40px 0;
            background-color: var(--panel-bg);
            padding: 20px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.05);
        }

        .chart-container {
            position: relative;
            height: 60vh;
            width: 100%;
        }

        .logs {
            font-family: 'Roboto Mono', monospace;
            background-color: #000;
            padding: 15px;
            margin-top: 20px;
            border-left: 3px solid var(--cyber-green);
            font-size: 0.85rem;
            color: #aaa;
        }

        .cta-container {
            margin-bottom: 50px;
        }

        .btn {
            background-color: transparent;
            color: var(--neon-gold);
            border: 1px solid var(--neon-gold);
            padding: 15px 30px;
            font-family: 'Roboto Mono', monospace;
            font-size: 1rem;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .btn:hover {
            background-color: var(--neon-gold);
            color: #000;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.5);
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>PROJECT GENESIS</h1>
        <div class="tagline">ALGORITHMIC MARKET INTELLIGENCE | GC=F (COMEX GOLD)</div>
    </div>

    <div class="dashboard">
        <div class="chart-container">
            <canvas id="marketChart"></canvas>
        </div>
        <div class="logs" id="terminal-log">
            > SYSTEM BOOTING...<br>
            > FETCHING RAW DATA FROM VAULT...
        </div>
    </div>

    <div class="cta-container">
        <a href="mailto:टेक कंसल्टेंट इंदौर@gmail.com?subject=Requesting Private Beta Access - Genesis" class="btn">Request Private Beta Access</a>
    </div>

    <script>
        async function loadData() {
            try {
                // Fetching Historical Data
                const marketRes = await fetch('market_data.csv');
                const marketCsv = await marketRes.text();
                
                // Fetching Prediction Data
                const predRes = await fetch('prediction_output.csv');
                const predCsv = await predRes.text();

                // Parsing CSVs
                const marketData = Papa.parse(marketCsv, { header: false, skipEmptyLines: true }).data;
                const predData = Papa.parse(predCsv, { header: false, skipEmptyLines: true }).data;

                // Arrays for Chart
                let labels = [];
                let historicalPrices = [];
                let predictedPrices = [];

                // Skip header row if exists, and extract data
                marketData.forEach((row, index) => {
                    if (index === 0 && row[0].includes("Timestamp")) return; 
                    if(row.length >= 3 && !isNaN(parseFloat(row[2]))) {
                        let dateText = row[0].substring(0, 10); // Get just YYYY-MM-DD
                        labels.push(dateText);
                        historicalPrices.push(parseFloat(row[2]));
                        predictedPrices.push(null); // Keep empty for historical line
                    }
                });

                // Get latest prediction
                let latestPrediction = null;
                if(predData.length > 0) {
                    let lastRow = predData[predData.length - 1];
                    if(lastRow.length >= 3 && !isNaN(parseFloat(lastRow[2]))) {
                        latestPrediction = parseFloat(lastRow[2]);
                        labels.push("NEXT CLOSE (AI)");
                        
                        // Connect the line from the last historical point
                        let connectPointArray = new Array(historicalPrices.length - 1).fill(null);
                        connectPointArray.push(historicalPrices[historicalPrices.length - 1]);
                        connectPointArray.push(latestPrediction);
                        
                        predictedPrices = connectPointArray;
                        historicalPrices.push(null);
                    }
                }

                // Render Chart
                const ctx = document.getElementById('marketChart').getContext('2d');
                new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: labels,
                        datasets: [
                            {
                                label: 'Historical Market Price (USD)',
                                data: historicalPrices,
                                borderColor: '#e0e0e0',
                                backgroundColor: 'rgba(224, 224, 224, 0.1)',
                                borderWidth: 2,
                                pointRadius: 4,
                                pointBackgroundColor: '#e0e0e0',
                                fill: true,
                                tension: 0.1
                            },
                            {
                                label: 'AI Predicted Next Close (USD)',
                                data: predictedPrices,
                                borderColor: '#FFD700',
                                backgroundColor: 'rgba(255, 215, 0, 0.2)',
                                borderWidth: 3,
                                borderDash: [5, 5],
                                pointRadius: 6,
                                pointBackgroundColor: '#FFD700',
                                pointBorderColor: '#000',
                                fill: false,
                                tension: 0.1
                            }
                        ]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: { labels: { color: '#e0e0e0', font: { family: 'Roboto Mono' } } }
                        },
                        scales: {
                            x: { grid: { color: '#333' }, ticks: { color: '#888', font: { family: 'Roboto Mono' } } },
                            y: { grid: { color: '#333' }, ticks: { color: '#888', font: { family: 'Roboto Mono' } } }
                        }
                    }
                });

                // Update Terminal Log
                document.getElementById('terminal-log').innerHTML = 
                    `> SYSTEM ONLINE.<br>` +
                    `> LAST DATA SYNC: SUCCESSFUL.<br>` +
                    `> LATEST AI FORECAST: $${latestPrediction ? latestPrediction : 'CALCULATING...'} USD`;

            } catch (error) {
                document.getElementById('terminal-log').innerHTML = `> ERROR: UNABLE TO ESTABLISH CONNECTION WITH VAULT.<br>> ${error}`;
            }
        }

        window.onload = loadData;
    </script>
</body>
</html>
