<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Genesis AI | Market Terminal</title>
    <style>
        body { background-color: #0d1117; color: #c9d1d9; font-family: 'Courier New', Courier, monospace; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; background: #161b22; padding: 20px; border-radius: 8px; border: 1px solid #30363d; }
        h1 { color: #58a6ff; border-bottom: 1px solid #30363d; padding-bottom: 10px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #30363d; }
        th { color: #8b949e; }
        .live-indicator { color: #3fb950; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Genesis AI Terminal <span class="live-indicator">● LIVE</span></h1>
        <p>Real-time Quantitative Market Data & Predictions (GC=F)</p>
        
        <table>
            <thead>
                <tr>
                    <th>Timestamp (UTC)</th>
                    <th>Asset</th>
                    <th>Price (USD)</th>
                </tr>
            </thead>
            <tbody id="data-table-body">
                <tr><td colspan="3">Fetching secure data from Supabase...</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        // === ENTERPRISE API CONNECTION ===
        // भाई, यहाँ नीचे वाले दोनों कोट्स (' ') के बीच में अपनी डिटेल्स डाल दे:
        const SUPABASE_URL = 'https://xmyawkycmsvatgpmwzrj.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhteWF3a3ljbXN2YXRncG13enJqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE0NzQ0NDAsImV4cCI6MjEwNzA1MDQ0MH0.g3B7yOcPfD4dY37ukXrH7EGrb0gK5qN7uu8eoqZyQ9g';

        async function fetchMarketData() {
            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/genesis_market_data?select=*&order=created_at.desc&limit=10`, {
                    method: 'GET',
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                        'Content-Type': 'application/json'
                    }
                });

                if (!response.ok) throw new Error('Data sync failed');
                
                const data = await response.json();
                const tableBody = document.getElementById('data-table-body');
                tableBody.innerHTML = ''; // Clear loading text

                data.forEach(row => {
                    const tr = document.createElement('tr');
                    // Format timestamp
                    const dateObj = new Date(row.created_at);
                    const formattedDate = dateObj.toISOString().replace('T', ' ').substring(0, 19);

                    tr.innerHTML = `
                        <td>${formattedDate}</td>
                        <td>${row.asset}</td>
                        <td style="color: #58a6ff; font-weight: bold;">$${row.price}</td>
                    `;
                    tableBody.appendChild(tr);
                });

            } catch (error) {
                console.error("API Error:", error);
                document.getElementById('data-table-body').innerHTML = '<tr><td colspan="3" style="color: #f85149;">Connection Error. System analyzing...</td></tr>';
            }
        }

        // Run fetch on load
        fetchMarketData();
    </script>
</body>
</html>
