<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Genesis Quantum | Institutional B2B Terminal</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@100;400;700;800&family=Space+Grotesk:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg-base: #000000; --bg-surface: #0a0a0c; --bg-panel: #111111; --accent-cyan: #00f0ff; --accent-magenta: #ff003c; --text-primary: #ffffff; --text-dim: #777777; --border-color: #222222; --success: #00ff73; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: var(--bg-base); color: var(--text-primary); font-family: 'Space Grotesk', sans-serif; overflow: hidden; }
        
        /* 🔒 SECURE LOGIN GATE */
        #auth-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #000000; z-index: 9999; display: flex; justify-content: center; align-items: center; }
        .auth-box { background: var(--bg-panel); border: 1px solid var(--border-color); padding: 50px; width: 100%; max-width: 400px; text-align: center; box-shadow: 0 0 30px rgba(0, 240, 255, 0.05); }
        .auth-logo { font-size: 28px; font-weight: 800; letter-spacing: 2px; margin-bottom: 5px; }
        .auth-logo span { color: var(--accent-cyan); }
        .auth-desc { font-family: 'JetBrains Mono'; font-size: 10px; color: var(--text-dim); margin-bottom: 40px; letter-spacing: 1px; }
        
        .api-input { width: 100%; background: var(--bg-base); border: 1px solid var(--border-color); color: var(--accent-cyan); padding: 15px; font-family: 'JetBrains Mono'; text-align: center; font-size: 14px; margin-bottom: 20px; outline: none; transition: border 0.3s; }
        .api-input:focus { border-color: var(--accent-cyan); }
        .auth-btn { width: 100%; background: var(--accent-cyan); color: #000; border: none; padding: 15px; font-weight: 800; font-family: 'Space Grotesk'; cursor: pointer; transition: 0.3s; font-size: 14px; letter-spacing: 1px; }
        .auth-btn:hover { background: #fff; }
        .error-msg { color: var(--accent-magenta); font-family: 'JetBrains Mono'; font-size: 11px; margin-top: 15px; display: none; }

        /* 💻 MAIN DASHBOARD */
        #main-dashboard { display: none; padding: 15px; height: 100vh; display: flex; flex-direction: column; }
        
        nav { display: flex; justify-content: space-between; align-items: center; padding-bottom: 15px; border-bottom: 1px solid var(--border-color); margin-bottom: 15px; }
        .nav-logo { font-size: 18px; font-weight: 800; letter-spacing: 1px; }
        .nav-logo span { color: var(--accent-cyan); }
        .nav-stats { display: flex; gap: 20px; font-family: 'JetBrains Mono'; font-size: 11px; color: var(--text-dim); }
        .status-dot { color: var(--success); text-shadow: 0 0 8px var(--success); }

        .dashboard-grid { display: grid; grid-template-columns: 75% 25%; gap: 15px; height: calc(100vh - 70px); }
        .panel { background: var(--bg-panel); border: 1px solid var(--border-color); display: flex; flex-direction: column; position: relative; }
        .panel-title { position: absolute; top: 10px; left: 15px; font-family: 'JetBrains Mono'; font-size: 10px; color: var(--text-dim); z-index: 10; background: rgba(17,17,17,0.8); padding: 2px 5px; }

        /* Chart & AI Sections */
        .chart-container { width: 100%; height: 100%; }
        
        .ai-sidebar { padding: 20px; display: flex; flex-direction: column; gap: 20px; overflow-y: auto; }
        .ai-card { background: var(--bg-base); border: 1px solid var(--border-color); padding: 20px; text-align: center; }
        .target-price { font-size: 32px; font-weight: 800; color: #fff; margin: 10px 0; }
        .signal-tag { display: inline-block; padding: 6px 12px; font-family: 'JetBrains Mono'; font-size: 12px; font-weight: 700; border: 1px solid; }
        .signal-bull { color: var(--success); border-color: var(--success); background: rgba(0, 255, 115, 0.05); }
        .signal-bear { color: var(--accent-magenta); border-color: var(--accent-magenta); background: rgba(255, 0, 60, 0.05); }
        
        .conf-wrapper { margin-top: 15px; text-align: left; }
        .conf-header { display: flex; justify-content: space-between; font-family: 'JetBrains Mono'; font-size: 10px; color: var(--text-dim); margin-bottom: 5px; }
        .conf-bar { width: 100%; height: 4px; background: var(--border-color); }
